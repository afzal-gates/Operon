version: "3.9"

services:
  operon.api:
    image: ${DOCKER_REGISTRY-}operonapi
    build:
      context: .
      dockerfile: src/Operon.Api/Dockerfile
    restart: always
    ports:
      - "5100:8180" # HTTP
      - "5101:8181" # HTTPS (if enabled)
    environment:
      - ConnectionStrings__Sql=Server=mssql;Database=MyDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__MongoDb=mongodb://mongo:27017
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_URLS=http://+:8180
    depends_on:
      - mssql
      - mongo
      - redis

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mssql_data:
  mongo_data:
  redis_data:
